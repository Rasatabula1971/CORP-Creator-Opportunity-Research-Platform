[project]
name = "corp"
version = "0.1.0"
description = "Creator Opportunity Research Platform — evidence-first creator/audience research engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    # Sync driver for Alembic (env.py uses a sync engine; the app itself uses asyncpg).
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pgvector>=0.3,<1",
    "tenacity>=8.3,<10",
    "pyrate-limiter>=3.6,<5",
    "google-api-python-client>=2.130,<3",
    "youtube-transcript-api>=0.6,<2",
    "yt-dlp>=2025.1",
    "google-generativeai>=0.7,<1",
    "sentence-transformers>=3.0,<4",
    "hdbscan>=0.8,<1",
    "bertopic>=0.16,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "import-linter>=2,<3",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["PYTHONHASHSEED=random"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_packages = ["corp"]

[[tool.importlinter.contracts]]
name = "core must not import workers"
type = "forbidden"
source_modules = ["corp.core"]
forbidden_modules = ["corp.workers"]

[[tool.importlinter.contracts]]
name = "core must not import api"
type = "forbidden"
source_modules = ["corp.core"]
forbidden_modules = ["corp.api"]

[[tool.importlinter.contracts]]
name = "warmstore must not import workers or api"
type = "forbidden"
source_modules = ["corp.warmstore"]
forbidden_modules = ["corp.workers", "corp.api"]
