version: "2.0.0"

# scoring_v2 — nine components, weights sum to 1.0.
# Frequency and commercial intent stay the largest levers. Saturation, alignment
# and cross-platform consistency are new and read creator-web pages, the
# creator's own content, and multi-platform evidence respectively.
weights:
  audience_problem_frequency: 0.20
  recency_trend: 0.05
  engagement_velocity: 0.10
  commercial_intent_strength: 0.20
  evidence_depth: 0.10
  creator_reach: 0.10
  competition_saturation: 0.10
  creator_content_alignment: 0.10
  cross_platform_consistency: 0.05

confidence_thresholds:
  high:
    min_sources: 3
    min_evidence: 10
    max_days_since_newest: 90
  medium:
    min_sources: 2
    min_evidence: 5
    max_days_since_newest: 180
  low:
    min_sources: 1
    min_evidence: 3

score_bands:
  exceptional:
    min: 0.85
    label: "Exceptional opportunity"
  strong:
    min: 0.70
    label: "Strong opportunity"
  moderate:
    min: 0.50
    label: "Moderate — worth watching"
  weak:
    min: 0.0
    label: "Weak — insufficient signal"
