version: "2.3.0"

# scoring_v2 — fourteen components, weights sum to 1.0.
# Frequency and commercial intent stay the largest levers. The three
# saturation components (competition_saturation, competitor_saturation,
# solution_saturation) run side by side — the creator's own storefront
# pages, a manually tracked Competitor list, and SolutionProvider evidence
# (marketplace/app-store/Product-Hunt listings) respectively. Whichever
# wasn't researched returns a neutral 0.5.
#
# T7 added the last four (external_demand_strength, solution_saturation,
# purchase_intent, audience_dissatisfaction) as pure functions. T21 wired
# them into the live pipeline by querying Evidence.evidence_type counts
# from the creator's niche-discovery runs. All fourteen components are
# now computed and weighted on every scoring pass.
#
# The original ten weights were scaled by 0.76 (uniformly, preserving
# their relative proportions exactly) to make room for the new 0.24 —
# 0.06 external_demand_strength, 0.04 solution_saturation, 0.08
# purchase_intent (the spec's own "most powerful demand signal
# available"), 0.06 audience_dissatisfaction.
weights:
  audience_problem_frequency: 0.152
  recency_trend: 0.038
  engagement_velocity: 0.076
  commercial_intent_strength: 0.152
  evidence_depth: 0.076
  creator_reach: 0.076
  competition_saturation: 0.038
  competitor_saturation: 0.038
  creator_content_alignment: 0.076
  cross_platform_consistency: 0.038
  external_demand_strength: 0.060
  solution_saturation: 0.040
  purchase_intent: 0.080
  audience_dissatisfaction: 0.060

confidence_thresholds:
  high:
    min_sources: 3
    min_evidence: 10
    max_days_since_newest: 90
  medium:
    min_sources: 2
    min_evidence: 5
    max_days_since_newest: 180
  low:
    min_sources: 1
    min_evidence: 3

score_bands:
  exceptional:
    min: 0.85
    label: "Exceptional opportunity"
  strong:
    min: 0.70
    label: "Strong opportunity"
  moderate:
    min: 0.50
    label: "Moderate — worth watching"
  weak:
    min: 0.0
    label: "Weak — insufficient signal"
