---
# CORP already uses Ruff, mypy, pytest, Semgrep, CodeQL and Oxc/TypeScript.
# MegaLinter is intentionally focused on repository-level gaps rather than
# duplicating those checks.
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - YAML_YAMLLINT
  - JSON_JSONLINT
  - COPYPASTE_JSCPD
  - MARKDOWN_MARKDOWNLINT

SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false

EXCLUDED_DIRECTORIES:
  - .git
  - .venv
  - venv
  - node_modules
  - htmlcov
  - megalinter-reports

# First integration run: report existing style/duplication debt without
# allowing it to hide structural errors in workflows or JSON.
YAML_YAMLLINT_DISABLE_ERRORS: true
MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: true
COPYPASTE_JSCPD_DISABLE_ERRORS: true
